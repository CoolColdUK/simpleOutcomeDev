# For detailed configuration, see https://supabase.com/docs/guides/local-development/cli/config
project_id = "simple-outcome"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://simpleoutcome.dev"]
jwt_expiry = 3600
enable_signup = false
