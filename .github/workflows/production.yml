# Production: Supabase migrations + Vercel (packages/web). Staging is a separate workflow.
name: Production
run-name: 'Prod: ${{ inputs.description }}'
'on':
  workflow_dispatch:
    inputs:
      description:
        description: 'Brief description'
        required: true
        type: string
      release_type:
        description: 'Release type (major or minor)'
        required: false
        type: choice
        default: 'minor'
        options:
          - minor
          - major
      deploy_supabase:
        description: 'Deploy Supabase DB migrations'
        required: false
        type: boolean
        default: true
      deploy_vercel:
        description: 'Deploy web to Vercel (production)'
        required: false
        type: boolean
        default: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: 'https://npm.pkg.github.com'

      - name: Git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-release-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Configure npm for private packages
        run: |
          echo "@coolcolduk:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc

      - name: Install
        run: npm ci

      - name: Verify TypeScript major version
        run: |
          TS_VERSION=$(node -p "require('typescript/package.json').version")
          echo "TypeScript version: $TS_VERSION"
          case "$TS_VERSION" in
            6.*) ;;
            *)
              echo "Expected TypeScript 6.x in CI but found $TS_VERSION"
              exit 1
              ;;
          esac

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Bump version with Lerna
        run: |
          RELEASE_TYPE="${{ inputs.release_type || 'minor' }}"
          npx lerna version $RELEASE_TYPE --no-git-tag-version --yes --no-push
          NEW_VERSION=$(node -p "require('./lerna.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          git add lerna.json package-lock.json
          find . -name "package.json" -not -path "*/node_modules/*" | xargs git add
          git commit -m "chore: bump version to $NEW_VERSION ($RELEASE_TYPE)"

      - name: Create tag (local only)
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "CURRENT_BRANCH=$CURRENT_BRANCH" >> $GITHUB_ENV
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          echo "NEXT_PUBLIC_GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Build model (production)
        if: ${{ inputs.deploy_vercel }}
        run: npm run build:model

      - name: Build component (production)
        if: ${{ inputs.deploy_vercel }}
        run: npm run build:component

      # ------------------------- Supabase -------------------------
      - name: Setup Supabase CLI
        if: ${{ inputs.deploy_supabase }}
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Supabase project (production)
        if: ${{ inputs.deploy_supabase }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::Add repository secret SUPABASE_ACCESS_TOKEN (Supabase Dashboard → Account → Access Tokens).'
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo '::error::Add repository secret SUPABASE_DB_PASSWORD_PROD (database password).'
            exit 1
          fi
          PROJECT_REF="${{ vars.SUPABASE_PROJECT_REF_PROD }}"
          if [ -z "${PROJECT_REF:-}" ]; then
            echo '::error::Add Actions variable SUPABASE_PROJECT_REF_PROD (project ref from the project URL).'
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push Supabase migrations (production)
        if: ${{ inputs.deploy_supabase }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --remote --yes

      # Dashboard: Framework Preset = Next.js, Root Directory = packages/web, “Include files outside root” on.
      # Disable Git→Vercel auto-deploy if you only want GHA deploys.
      # Env stays on GitHub. This deploy writes .env for the build and passes the same values for this deployment only.
      - name: Deploy web to Vercel (production, prebuilt)
        if: ${{ inputs.deploy_vercel }}
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.NEW_VERSION }}
          NEXT_PUBLIC_GIT_COMMIT: ${{ env.NEXT_PUBLIC_GIT_COMMIT }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PROD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
          NEXT_PUBLIC_SITES_ROOT_DOMAIN: ${{ vars.NEXT_PUBLIC_SITES_ROOT_DOMAIN_PROD }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_PROD }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo '::error::Repository variable SUPABASE_PROJECT_REF_PROD is empty.'
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_SITES_ROOT_DOMAIN:-}" ]; then
            echo '::error::Repository variable NEXT_PUBLIC_SITES_ROOT_DOMAIN_PROD is empty.'
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo '::error::Repository variable NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD is empty.'
            exit 1
          fi
          export NEXT_PUBLIC_SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co"
          if [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo '::error::Repository secret SUPABASE_SECRET_KEY_PROD is empty.'
            exit 1
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          node <<'NODE'
          const {mkdirSync, readFileSync, writeFileSync} = require('node:fs');
          const path = '.vercel/.env.production.local';
          const keys = [
            'SUPABASE_PROJECT_REF',
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_ANON_KEY',
            'NEXT_PUBLIC_SITES_ROOT_DOMAIN',
            'SUPABASE_SECRET_KEY',
            'NEXT_PUBLIC_APP_VERSION',
            'NEXT_PUBLIC_GIT_COMMIT',
          ];
          const values = {};
          for (const key of keys) {
            const value = process.env[key];
            if (value === undefined || value.length === 0) {
              console.error(`::error::${key} is empty. Refusing to build.`);
              process.exit(1);
            }
            values[key] = value;
          }
          mkdirSync('.vercel', {recursive: true});
          let existing = '';
          try {
            existing = readFileSync(path, 'utf8');
          } catch (error) {
            if (error.code !== 'ENOENT') {
              throw error;
            }
          }
          const quote = (value) => `"${value.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n')}"`;
          const kept = existing.split(/\r?\n/).filter((line) => {
            if (line.length === 0) {
              return false;
            }
            const eq = line.indexOf('=');
            if (eq === -1) {
              return true;
            }
            const name = line.slice(0, eq).replace(/^export\s+/, '').trim();
            return !Object.hasOwn(values, name);
          });
          const lines = [...kept, ...keys.map((key) => `${key}=${quote(values[key])}`)];
          writeFileSync(path, `${lines.join('\n')}\n`);
          const written = readFileSync(path, 'utf8').split(/\r?\n/);
          for (const key of keys) {
            const expected = `${key}=${quote(values[key])}`;
            if (!written.includes(expected)) {
              console.error(`::error::${key} in .vercel/.env.production.local does not match GitHub. Refusing to build.`);
              process.exit(1);
            }
          }
          console.log('Wrote build env from GitHub into .vercel/.env.production.local. Values are not printed. Nothing is saved on the Vercel project.');
          NODE
          npx vercel build --prod --yes --token="$VERCEL_TOKEN"
          deploy_args=(npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          for key in \
            SUPABASE_PROJECT_REF \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            NEXT_PUBLIC_SITES_ROOT_DOMAIN \
            SUPABASE_SECRET_KEY \
            NEXT_PUBLIC_APP_VERSION \
            NEXT_PUBLIC_GIT_COMMIT
          do
            deploy_args+=(--env "${key}=${!key}")
          done
          "${deploy_args[@]}"

      - name: Push tag and commit
        run: |
          git push origin "v$NEW_VERSION"
          git push origin $CURRENT_BRANCH

      - name: Create GitHub Release
        env:
          RELEASE_DESCRIPTION: ${{ inputs.description }}
          RELEASE_TYPE: ${{ inputs.release_type || 'minor' }}
        run: |
          printf '%s\n\nRelease type: %s (production)\n' "$RELEASE_DESCRIPTION" "$RELEASE_TYPE" > /tmp/release-notes-head.md
          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --generate-notes \
            --notes-file /tmp/release-notes-head.md \
            --target ${{ env.CURRENT_BRANCH }}
