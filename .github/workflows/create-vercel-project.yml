# One-shot: create (or update) a Vercel project without connecting GitHub.
# Does not deploy. After this succeeds, run the Production workflow.
name: Create Vercel project
run-name: 'Create Vercel project: ${{ inputs.project_name }}'
'on':
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Vercel project name (lowercase, hyphens). Use a new name for stage, not simple-outcome.'
        required: true
        type: string
        default: 'simple-outcome'
      target:
        description: 'GitHub variable that receives the project id'
        required: true
        type: choice
        default: prod
        options:
          - prod
          - stage
      upsert_github_vars:
        description: 'Write VERCEL_ORG_ID and VERCEL_PROJECT_ID_PROD or VERCEL_PROJECT_ID_STAGE'
        required: false
        type: boolean
        default: true
      sync_env:
        description: 'Copy NEXT_PUBLIC_* GitHub secrets onto the Vercel project (if those secrets exist)'
        required: false
        type: boolean
        default: true

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      PROJECT_NAME: ${{ inputs.project_name }}
      TARGET: ${{ inputs.target }}
      EXISTING_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    steps:
      - name: Require VERCEL_TOKEN
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::Add repository secret VERCEL_TOKEN (https://vercel.com/account/tokens).'
            exit 1
          fi

      - name: Create or update Vercel project
        id: vercel
        env:
          SYNC_ENV: ${{ inputs.sync_env }}
          ENV_SUFFIX: ${{ inputs.target == 'stage' && 'STAGE' || 'PROD' }}
          SUPABASE_PROJECT_REF: ${{ inputs.target == 'stage' && vars.SUPABASE_PROJECT_REF_STAGE || vars.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_ANON_KEY: ${{ inputs.target == 'stage' && vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGE || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD }}
          SITES_ROOT_DOMAIN: ${{ inputs.target == 'stage' && vars.NEXT_PUBLIC_SITES_ROOT_DOMAIN_STAGE || vars.NEXT_PUBLIC_SITES_ROOT_DOMAIN_PROD }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = 'stage' ] && [ "$PROJECT_NAME" = 'simple-outcome' ]; then
            echo '::error::Stage needs its own project name, for example simple-outcome-stage.'
            exit 1
          fi
          API='https://api.vercel.com'

          vercel_get() {
            curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "$@"
          }

          vercel_json() {
            curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' "$@"
          }

          TEAM="${EXISTING_ORG_ID:-}"
          if [ -z "$TEAM" ]; then
            USER_JSON="$(vercel_get "${API}/v2/user")"
            TEAM="$(printf '%s' "$USER_JSON" | jq -r '.user.defaultTeamId // empty')"
          fi
          if [ -z "$TEAM" ]; then
            TEAMS_JSON="$(vercel_get "${API}/v2/teams")"
            COUNT="$(printf '%s' "$TEAMS_JSON" | jq '.teams | length')"
            if [ "$COUNT" = '1' ]; then
              TEAM="$(printf '%s' "$TEAMS_JSON" | jq -r '.teams[0].id')"
            else
              echo '::error::Could not resolve Vercel team id. Set GitHub variable VERCEL_ORG_ID (team_…) and re-run.'
              printf '%s\n' "$TEAMS_JSON" | jq '{teams: [.teams[] | {id, slug, name}]}'
              exit 1
            fi
          fi

          echo "Using Vercel team/org id: ${TEAM}"
          echo "org_id=${TEAM}" >> "$GITHUB_OUTPUT"

          LIST_CODE="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${API}/v9/projects/${PROJECT_NAME}?teamId=${TEAM}")"

          CREATE_PAYLOAD="$(jq -n \
            --arg name "$PROJECT_NAME" \
            '{
              name: $name,
              framework: "nextjs",
              rootDirectory: "packages/web"
            }')"
          PATCH_PAYLOAD="$(jq -n '{
            framework: "nextjs",
            rootDirectory: "packages/web",
            sourceFilesOutsideRootDirectory: true
          }')"

          if [ "$LIST_CODE" = '200' ]; then
            echo 'Project already exists; updating root directory settings.'
            PATCH_CODE="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$PATCH_PAYLOAD" \
              "${API}/v9/projects/${PROJECT_NAME}?teamId=${TEAM}")"
            if [ "$PATCH_CODE" != '200' ]; then
              echo "::error::Failed to update Vercel project (HTTP ${PATCH_CODE})"
              cat /tmp/vercel-project.json
              exit 1
            fi
            PROJECT_ID="$(jq -r '.id' /tmp/vercel-project.json)"
          else
            echo 'Creating Vercel project (no Git connection).'
            CREATE_CODE="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$CREATE_PAYLOAD" \
              "${API}/v11/projects?teamId=${TEAM}")"
            if [ "$CREATE_CODE" != '200' ] && [ "$CREATE_CODE" != '201' ]; then
              echo "::error::Failed to create Vercel project (HTTP ${CREATE_CODE})"
              cat /tmp/vercel-project.json
              exit 1
            fi
            PROJECT_ID="$(jq -r '.id' /tmp/vercel-project.json)"
            PATCH_CODE="$(curl -sS -o /tmp/vercel-project-patch.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$PATCH_PAYLOAD" \
              "${API}/v9/projects/${PROJECT_NAME}?teamId=${TEAM}")"
            if [ "$PATCH_CODE" != '200' ]; then
              echo "::warning::Project created, but updating include-files-outside-root failed (HTTP ${PATCH_CODE}). New projects usually default this to on."
              cat /tmp/vercel-project-patch.json
            fi
          fi

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = 'null' ]; then
            echo '::error::Vercel response had no project id.'
            cat /tmp/vercel-project.json
            exit 1
          fi
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "Created/updated project ${PROJECT_NAME} (${PROJECT_ID})"

          upsert_env() {
            KEY="$1"
            VALUE="$2"
            if [ -z "$VALUE" ]; then
              echo "Skipping ${KEY} (secret not set on GitHub)."
              return 0
            fi
            BODY="$(jq -n --arg key "$KEY" --arg value "$VALUE" '{
              key: $key,
              value: $value,
              type: "plain",
              target: ["production", "preview", "development"]
            }')"
            CODE="$(curl -sS -o /tmp/vercel-env.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$BODY" \
              "${API}/v10/projects/${PROJECT_ID}/env?teamId=${TEAM}&upsert=true")"
            if [ "$CODE" != '200' ] && [ "$CODE" != '201' ]; then
              echo "::warning::Could not set ${KEY} on Vercel (HTTP ${CODE})"
              cat /tmp/vercel-env.json
              return 0
            fi
            echo "Set ${KEY} on Vercel."
          }

          if [ "$SYNC_ENV" = 'true' ]; then
            if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
              echo "::error::Repository variable SUPABASE_PROJECT_REF_${ENV_SUFFIX} is empty."
              exit 1
            fi
            if [ -z "${SITES_ROOT_DOMAIN:-}" ]; then
              echo "::error::Repository variable NEXT_PUBLIC_SITES_ROOT_DOMAIN_${ENV_SUFFIX} is empty."
              exit 1
            fi
            upsert_env NEXT_PUBLIC_SITES_ROOT_DOMAIN "$SITES_ROOT_DOMAIN"
            upsert_env NEXT_PUBLIC_SUPABASE_URL "https://${SUPABASE_PROJECT_REF}.supabase.co"
            upsert_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          fi

      - name: Write GitHub Actions variables
        if: ${{ inputs.upsert_github_vars }}
        env:
          ORG_ID: ${{ steps.vercel.outputs.org_id }}
          PROJECT_ID: ${{ steps.vercel.outputs.project_id }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = 'stage' ] && [ "$PROJECT_NAME" = 'simple-outcome' ]; then
            echo '::error::Stage needs its own project name, for example simple-outcome-stage.'
            exit 1
          fi
          PROJECT_ID_NAME="VERCEL_PROJECT_ID_$(printf '%s' "$TARGET" | tr '[:lower:]' '[:upper:]')"
          echo "VERCEL_ORG_ID=${ORG_ID}"
          echo "${PROJECT_ID_NAME}=${PROJECT_ID}"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::warning::GH_PAT is not set. Add the two variables above in GitHub → Settings → Secrets and variables → Actions → Variables.'
            exit 0
          fi
          if gh variable set VERCEL_ORG_ID --body "$ORG_ID" --repo "$GITHUB_REPOSITORY" \
            && gh variable set "$PROJECT_ID_NAME" --body "$PROJECT_ID" --repo "$GITHUB_REPOSITORY"; then
            echo "Wrote VERCEL_ORG_ID and ${PROJECT_ID_NAME}."
            exit 0
          fi
          echo '::warning::Could not write GitHub variables (GH_PAT needs Variables write on this repo, or use a classic PAT with repo scope). Add them by hand — this does not affect the Vercel project.'


      - name: Summary
        env:
          ORG_ID: ${{ steps.vercel.outputs.org_id }}
          PROJECT_ID: ${{ steps.vercel.outputs.project_id }}
        run: |
          {
            echo '## Vercel project'
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Name | \`${PROJECT_NAME}\` |"
            echo "| Org / team id | \`${ORG_ID}\` |"
            echo "| Project id | \`${PROJECT_ID}\` |"
            echo "| Root directory | \`packages/web\` |"
            echo "| Git | not connected |"
            echo
            echo 'GitHub variable written when the write switch is on:'
            echo
            echo '- `VERCEL_ORG_ID`'
            echo "- \`VERCEL_PROJECT_ID_$(printf '%s' "$TARGET" | tr '[:lower:]' '[:upper:]')\`"
            echo
            echo 'GitHub secret still required: `VERCEL_TOKEN`.'
            echo
            echo 'Deploy workflows read GitHub, not the Vercel project settings. Leave env sync off unless you want a copy on the project.'
          } >> "$GITHUB_STEP_SUMMARY"
