# Pull request checks only. Does not bump versions, push migrations, or deploy.
name: CI
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-release-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Configure npm for private packages
        run: |
          echo "@coolcolduk:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc

      - name: Install
        run: npm ci

      - name: Verify TypeScript major version
        run: |
          TS_VERSION=$(node -p "require('typescript/package.json').version")
          echo "TypeScript version: $TS_VERSION"
          case "$TS_VERSION" in
            6.*) ;;
            *)
              echo "Expected TypeScript 6.x in CI but found $TS_VERSION"
              exit 1
              ;;
          esac

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build model (CI)
        run: npm run build:model

      - name: Build component (CI)
        run: npm run build:component

      - name: Build web (CI type check)
        env:
          NEXT_PUBLIC_WEB_URL: https://ci-build-test.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJkdW1teSIsInJvbGUiOiJhbm9uIn0.dummy
          NEXT_PUBLIC_APP_VERSION: 0.0.0-ci
          NEXT_PUBLIC_GIT_COMMIT: ${{ github.sha }}
        run: npm run build:web
