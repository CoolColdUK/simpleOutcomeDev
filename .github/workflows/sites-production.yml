# Sites: deploy packages/sites to the sites Vercel project. No version bump, no migrations, no main-app deploy.
name: Sites production
run-name: 'Sites: ${{ inputs.description }}'
'on':
  workflow_dispatch:
    inputs:
      description:
        description: 'Brief description'
        required: true
        type: string

jobs:
  deploy_sites:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: 'https://npm.pkg.github.com'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-release-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Configure npm for private packages
        run: |
          echo "@coolcolduk:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc

      - name: Install
        run: npm ci

      - name: Build model
        run: npm run build:model

      - name: Deploy sites to Vercel (production, prebuilt)
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_SITES }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::Add repository secret VERCEL_TOKEN.'
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo '::error::Set GitHub variables VERCEL_ORG_ID and VERCEL_PROJECT_ID_SITES (Create Vercel sites project).'
            exit 1
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --yes --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
